<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ícono de MetroCDMX PWA. Diseño propio: "M" naranja sobre fondo oscuro y una
       vía con los colores de cuatro líneas. Todo el contenido cabe en el 80 %
       central (zona segura de los íconos "maskable" de Android). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2230"/><stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A2B"/><stop offset="1" stop-color="#E97B11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#E97B11" stop-opacity=".22"/><stop offset="1" stop-color="#E97B11" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- M -->
  <path d="M104 366 V146 h66 l86 118 86-118 h66 v220 h-60 V242 l-92 124 -92-124 v124 z" fill="url(#or)"/>
  <!-- Vía con estaciones -->
  <rect x="104" y="398" width="304" height="10" rx="5" fill="#3a4152"/>
  <circle cx="132" cy="403" r="15" fill="#F56394" stroke="#0d0f14" stroke-width="4"/>
  <circle cx="215" cy="403" r="15" fill="#0064A8" stroke="#0d0f14" stroke-width="4"/>
  <circle cx="297" cy="403" r="15" fill="#018749" stroke="#0d0f14" stroke-width="4"/>
  <circle cx="380" cy="403" r="15" fill="#FDDF00" stroke="#0d0f14" stroke-width="4"/>
</svg>
